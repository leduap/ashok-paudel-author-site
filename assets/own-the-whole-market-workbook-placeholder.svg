<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Placeholder cover: The Own the Whole Market Workbook, by Ashok Paudel">
  <!-- PLACEHOLDER COVER. Replace with the real cover once the book is live. -->
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf9f4"/>
      <stop offset="0.45" stop-color="#dcf7f2"/>
      <stop offset="1" stop-color="#bee3d1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#mint)"/>

  <g font-family="Poppins, 'Avenir Next', 'Century Gothic', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Eyebrow label with its underline bar -->
    <text x="60" y="72" font-size="18" font-weight="600" letter-spacing="1.6" fill="#0c6c46">WORKBOOK</text>
    <rect x="60" y="86" width="66" height="5" fill="#20a25a"/>

    <!-- Title -->
    <g font-size="84" font-weight="700" fill="#233040" letter-spacing="-1">
      <text x="56" y="212">The Own</text>
      <text x="56" y="306">the Whole</text>
      <text x="56" y="400">Market</text>
      <text x="56" y="494">Workbook</text>
    </g>
  </g>

  <!-- Simple worksheet motif: tick boxes and lines in the theme's accent colours -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="63" y="583" width="38" height="38" rx="6" stroke="#0f7c87"/>
    <path d="M72 603 l8 8 l14 -17" stroke="#0f7c87"/>
    <rect x="63" y="651" width="38" height="38" rx="6" stroke="#e3572e"/>
    <path d="M72 671 l8 8 l14 -17" stroke="#e3572e"/>
    <rect x="63" y="719" width="38" height="38" rx="6" stroke="#e3aa2a"/>
  </g>
  <g fill="#233040" opacity="0.22">
    <rect x="126" y="596" width="330" height="12" rx="6"/>
    <rect x="126" y="664" width="270" height="12" rx="6"/>
    <rect x="126" y="732" width="300" height="12" rx="6"/>
  </g>

  <!-- Author name band -->
  <rect y="795" width="600" height="105" fill="#11705c"/>
  <text x="60" y="862" font-family="Poppins, 'Avenir Next', 'Century Gothic', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="0.5" fill="#ffffff">ASHOK PAUDEL</text>
</svg>
