# Builds the site and publishes it to GitHub Pages every time something is
# pushed to the main branch (for example when the bot adds a post).
#
# One-time setup on GitHub: repository Settings > Pages > "Build and
# deployment" > Source: choose "GitHub Actions".

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes arrive close together, finish the first publish before the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Find the site's public address
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site (fails here if a post is malformed)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py

      - name: Hand the built site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
